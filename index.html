<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — Meridian Grade School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="login-screen">
  <div class="login-card">
    <div class="login-crest">
      <div class="crest-mark">MG</div>
      <div class="login-crest-text">
        <span class="login-crest-name">Meridian</span>
        <span class="login-crest-sub">Grade School</span>
      </div>
    </div>

    <div class="login-error" id="loginError"></div>

    <form id="loginForm">
      <label class="login-field">
        <span>Username</span>
        <input type="text" id="loginUsername" autocomplete="username" required>
      </label>
      <label class="login-field">
        <span>Password</span>
        <input type="password" id="loginPassword" autocomplete="current-password" required>
      </label>
      <button type="submit" class="login-submit" id="loginSubmit">Sign in</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://dmrdufunkqvjrfyxyimc.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRtcmR1ZnVua3F2anJmeXh5aW1jIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg2MTQ0ODgsImV4cCI6MjEwNDE5MDQ4OH0.UBSCuqEfi9t7Ey6SRtdrPfoxHjqkapJa1jzqRkn6q2c";

  // HTTP headers are Latin-1 only. A curly quote, non-breaking space or an
  // ellipsis from a truncated copy-paste makes every Supabase call die inside
  // fetch() with an unhelpful "non ISO-8859-1 code point" error. Fail here
  // instead, naming the exact character.
  (function assertKeyIsHeaderSafe(key) {
    const bad = [...key].findIndex(ch => ch.codePointAt(0) > 255);
    if (bad !== -1) {
      const ch = key[bad];
      throw new Error(
        `Supabase anon key has a non-ISO-8859-1 character at index ${bad}: "${ch}" ` +
        `(U+${ch.codePointAt(0).toString(16).toUpperCase()}). Re-copy it from Project Settings > API.`
      );
    }
  })(SUPABASE_ANON_KEY);

  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const form = document.getElementById("loginForm");
  const errorBox = document.getElementById("loginError");
  const submitBtn = document.getElementById("loginSubmit");
  const params = new URLSearchParams(location.search);

  function showError(message) {
    errorBox.textContent = message;
    errorBox.classList.add("is-visible");
  }
  function resetSubmit() {
    submitBtn.disabled = false;
    submitBtn.textContent = "Sign in";
  }

  // A reason handed back by the dashboard's auth guard, so a bounce isn't silent.
  if (params.get("err") === "no-profile") {
    showError("Signed in, but this account has no matching row in profiles. Ask an admin to link it.");
  }

  // Already signed in? Skip straight to the dashboard — but never while an error
  // is on screen, or the redirect ping-pongs and the message can't be read.
  if (!params.get("err")) {
    supabaseClient.auth.getSession()
      .then(({ data }) => { if (data.session) window.location.href = "dashboard.html"; })
      .catch(err => console.error("getSession failed:", err));
  }

  // email_for_username may be declared RETURNS text, RETURNS TABLE(...) or SETOF.
  // The first gives a string, the others give an array. Coerce all of them to a
  // plain string; anything else counts as "not found", because posting a
  // non-string email to GoTrue answers 500 rather than 400.
  function coerceEmail(value) {
    if (typeof value === "string") return value.trim();
    if (Array.isArray(value)) return value.length ? coerceEmail(value[0]) : "";
    if (value && typeof value === "object") {
      const first = value.email ?? Object.values(value)[0];
      return typeof first === "string" ? first.trim() : "";
    }
    return "";
  }

  const looksLikeEmail = (s) => typeof s === "string" && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(s);

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    errorBox.classList.remove("is-visible");
    submitBtn.disabled = true;
    submitBtn.textContent = "Signing in...";

    const username = document.getElementById("loginUsername").value.trim();
    const password = document.getElementById("loginPassword").value;

    let email = "";

    if (looksLikeEmail(username)) {
      email = username; // an email typed straight into the username box
    } else {
      const { data, error: lookupError } = await supabaseClient.rpc("email_for_username", {
        lookup_username: username,
      });
      if (lookupError) {
        console.error("email_for_username failed:", lookupError);
        showError("Couldn't look up that username - see the browser console.");
        resetSubmit();
        return;
      }
      email = coerceEmail(data);
    }

    if (!looksLikeEmail(email)) {
      showError("No account found for that username.");
      resetSubmit();
      return;
    }

    const { error } = await supabaseClient.auth.signInWithPassword({ email, password });

    if (error) {
      // Logged verbatim - this is what names the real cause of a 500.
      console.error("signInWithPassword failed:", error.status, error.code, error.message, error);
      if (!error.status) {
        showError("Couldn't reach the sign-in server. See the browser console.");
      } else if (error.status >= 500) {
        showError(`Sign-in server error (${error.status}): ${error.message}`);
      } else if (error.status === 400 || error.code === "invalid_credentials") {
        showError("Incorrect username or password.");
      } else if (error.code === "email_not_confirmed") {
        showError("That account's email hasn't been confirmed yet.");
      } else {
        showError(error.message || "Couldn't sign in.");
      }
      resetSubmit();
      return;
    }

    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
